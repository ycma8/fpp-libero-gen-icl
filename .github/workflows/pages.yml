name: Publish method article
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: article/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: article
      - run: npm run build
        working-directory: article
        env:
          SITE_URL: https://ycma8.github.io
          BASE_PATH: /fpp-libero-gen-icl
      - uses: actions/upload-pages-artifact@v3
        with:
          path: article/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
