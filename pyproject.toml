[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "fpp-libero-gen"
version = "1.0.0"
description = "Full-History Patch Policy for demonstration-conditioned imitation on LIBERO-Gen"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["h5py>=3.9", "numpy>=1.24", "timm>=1.0", "torch>=2.5", "huggingface_hub>=0.24", "imageio>=2.34", "imageio-ffmpeg>=0.5"]
[tool.setuptools.packages.find]
include = ["fpp_libero_mem*", "fpp_libero_gen*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[project.optional-dependencies]
dev = ["pytest>=8"]
